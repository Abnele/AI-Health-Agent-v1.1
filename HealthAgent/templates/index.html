<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport", content="width=device-width, initial-scale = 1.0">
    <title>Health Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>



<body>

    <main>
        <!-- Settings Hotbar -->
        <section id="settings-hotbar">
            <h3>Settings</h3>
            <div class = "button-container">
                <button id="theme-switcher">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
                </button>
            </div>
            
        </section>


        <!-- Goals Section -->
        <section id="goals-section">
            <h2>Your Goals</h2>
            <div id="goals-form">
                <label>Steps per day
                    <input type="number" id="goal-steps" placeholder="5000">
                </label>

                <label>Hours slept per day
                    <input type="number" id="goal-sleep" placeholder="8">
                </label>

                <label>Hourly screen time per day
                    <input type="number" id="goal-screen" placeholder = "4">
                </label>
                <button onclick="saveGoals()">Save Goals</button>
            </div>
        </section>

        <!-- Data Section -->
        <section id="data-section">
            <h2>Today's Data</h2>
            <div id="data-form">

                <label>Date
                    <input type ="date" id="data-date">
                </label>

                <label>Steps today
                    <input type="number" id="data-steps" placeholder="4500">
                </label>

                <label>Hours slept today
                    <input type="number" id="data-sleep" placeholder="7">
                </label>

                <label>Hourly screen time today
                    <input type="number" id="data-screen" placeholder = "6">
                </label>
                <button onclick="addData()">Add Day</button>
            </div>
        </section>


        <!-- Advice Section -->
        <section id="advice-section">
            <h2>Your Report</h2>
            <button onclick="getAdvice()">Generate Report</button>
            <div id="report-type"></div>
            <ul id="advice-list"></ul>
        </section>

        <!-- History Section -->
        <section id="history-section">
            <h2>Your Logged Days</h2>
            <button onclick="refreshHistory()">Refresh History</button>
            <ul id = "logged-days"></ul>
        </section>


    </main>

    <script src="/static/app.js"></script>
</body>
</html>
